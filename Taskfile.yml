# https://taskfile.dev
version: '3'

vars:
  GREETING: Hello, World!

tasks:
  export:
    sources:
      - raw-photos/*.jpg
    cmds:
      - rm -rf photos
      - mkdir photos
      - for: sources
        cmd: >
          echo "exporting {{.ITEM}}..." &&
          cwebp -q 60 -resize 1000 0
          -o photos/$(basename --suffix=.jpg {{.ITEM}}).webp
          {{.ITEM}}

  install-deps:
    status:
      - test -f .venv/bin/python
    sources:
      - requirements.txt
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -r requirements.txt

  build:
    deps:
      - install-deps
    sources:
      - templates/*.j2
      - data.yaml
    generates:
      - public
    cmds:
      - mkdir -p public
      - .venv/bin/python3 generate.py
      - cp -r photos/ public/

  default:
    cmds:
      - task: build
